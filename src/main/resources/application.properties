spring.application.name=backend
server.port=8080

# Logging
logging.pattern.level=%5p [requestId=%X{requestId:-}]

# Load local configuration
spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/c2c_marketplace
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

app.mail.from=${MAIL_FROM}
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
app.jwt.secret-base64=${JWT_SECRET_BASE64}

# Cloudflare R2
app.r2.endpoint=https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
app.r2.access-key-id=${R2_ACCESS_KEY_ID}
app.r2.secret-access-key=${R2_SECRET_ACCESS_KEY}
app.r2.bucket=${R2_BUCKET}

spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB

app.media.ticket-secret-base64=${MEDIA_TICKET_SECRET_BASE64}

spring.jpa.hibernate.ddl-auto=none

app.ai.deepseek.api-key=${DEEPSEEK_API_KEY}
app.ai.deepseek.model=deepseek-flash